services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: stripboard-ch
    environment:
      CLICKHOUSE_USER: stripboard
      CLICKHOUSE_PASSWORD: stripboard
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"   # HTTP — what mcp-clickhouse talks to
      - "9000:9000"   # native
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ch-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ch-data:
