[project]
name = "stripboard"
version = "0.1.0"
description = "An agent that reads a screenplay and returns a production breakdown you can defend."
requires-python = ">=3.11"
dependencies = [
    "mcp-clickhouse>=0.4.1",
    "google-genai>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stripboard"]
